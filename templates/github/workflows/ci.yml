# CI pipeline. Stages follow core/testing.mdc gates: every PR runs the commit
# gate + the PR gate. Jobs are independent so failures are attributable.
#
# Defaults assume pnpm + Node 22 + TypeScript with the scripts named below in
# package.json (see TEST_PLAN.md for what each runs). For another stack, swap
# the setup steps and commands; keep the job structure. Validated with
# actionlint.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  CI: true
  NODE_VERSION: "22"

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Dead code and unused dependencies
        run: pnpm knip && pnpm depcheck

  secrets-and-deps:
    name: Secret scan, dependency audit, licenses, SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (fail on high/critical)
        run: pnpm audit --audit-level=high
      - name: License check
        run: pnpm licenses list --json | node scripts/check-licenses.mjs
      - name: SAST
        uses: github/codeql-action/init@v3
        with: { languages: "javascript-typescript" }
      - uses: github/codeql-action/analyze@v3

  unit:
    name: Unit + property-based + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit --coverage
      - name: Enforce per-layer coverage floors from TEST_PLAN.md
        run: pnpm coverage:check
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage }

  mutation:
    name: Mutation testing on changed files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stryker run --incremental --since origin/${{ github.base_ref }}

  integration:
    name: Integration, API, contract, database, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrations up, down, up on clean DB
        run: pnpm db:migrate && pnpm db:rollback && pnpm db:migrate
      - name: Migrations on seeded DB
        run: pnpm db:seed && pnpm db:migrate
      - name: RLS and database tests
        run: pnpm test:db
      - name: Integration + API tests
        run: pnpm test:integration
      - name: Contract tests + OpenAPI lint
        run: pnpm test:contract && pnpm spectral lint openapi.json
      - name: Idempotency and concurrency suites
        run: pnpm test:concurrency

  fuzz:
    name: Fuzz changed boundaries (time-boxed)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz -- --max-time 300

  ui:
    name: Component, accessibility, visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:component
      - run: pnpm test:a11y
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: visual-diffs, path: test-results }

  e2e:
    name: E2E critical paths (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: playwright-report }

  performance:
    name: Benchmarks + Lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench -- --fail-on-regression
      - run: pnpm build && pnpm lhci autorun

  containers-and-iac:
    name: Container + IaC scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan (skipped when the repo has no Dockerfile or IaC)
        if: hashFiles('**/Dockerfile*', '**/*.tf') != ''
        uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: "1" }

  gate:
    name: All PR checks green
    runs-on: ubuntu-latest
    needs: [static, secrets-and-deps, unit, mutation, integration, fuzz, ui, e2e, performance, containers-and-iac]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || echo "all green"
